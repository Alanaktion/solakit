id = "webpage-read"
family = "selection"
prompt = "Read https://example.test/changelog and tell me the newest version number."
tools = ["web.get_page", "web.search", "shell.run", "files.read"]
expect_first_tool = "web.get_page"
expect_calls = [{ name = "web.get_page", args_subset = { url = "example.test/changelog" } }]
forbid_tools = ["shell.run", "files.read"]
expect_final_contains = ["4.2.0"]
max_steps = 4

[[responses."web.get_page"]]
content = "# Changelog\n\n## 4.2.0 (2026-10-30)\n- Faster sync\n\n## 4.1.3 (2026-09-12)\n- Fixes"

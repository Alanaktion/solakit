id = "loop-identical-error"
family = "loop"
description = "Tool always fails; the model must stop and report rather than retry forever."
prompt = "Look up the latest release of acme/widgets."
tools = ["github.latest_release"]
expect_final_any = ["unable", "could not", "couldn't", "not found", "error", "failed", "does not exist", "inaccessible", "confirm"]
max_steps = 8

[[responses."github.latest_release"]]
error = true
content = "Repository not found or not accessible."

id = "thinking-hard-reasoning"
family = "thinking"
prompt = "A train leaves at 09:40 and arrives at 13:15. How many minutes is the trip? Answer with the number."
tools = ["math.eval"]
allow_tools = ["math.eval"]
expect_final_contains = ["215"]
max_steps = 3

[[responses."math.eval"]]
content = '{"result": "215"}'

{% extends 'base.html' %}
{% block title %}Archive session · Solakit{% endblock %}
{% block content %}<section class="panel archive-confirm"><h1>Archive {{ session.title or session.id }}?</h1><p>Hide this session from the active list. Its messages, media and search results are preserved. You can restore it afterwards.</p><div class="archive-confirm-actions"><a class="text-link" href="/sessions/{{ session.id|urlencode }}">Cancel</a><form method="post" action="/sessions/{{ session.id|urlencode }}/lifecycle/archive{% if request.query_params.get('return_to') == 'chat' %}?return_to=chat{% endif %}"><button class="primary-button" type="submit">Archive session</button></form></div></section>{% endblock %}

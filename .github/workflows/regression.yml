# Mock/contract regression only. Live behavior requires a real environment.
name: regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true

      # The clean-room check: a fresh environment built only from the
      # lockfile must work. This is what keeps `uv sync` from silently
      # drifting away from the packs again.
      - name: Sync workspace from the lockfile
        run: uv sync --frozen --all-packages

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check refactored subsystems
        run: uv run mypy

      - name: Test (core + packs)
        run: uv run pytest tests packs/*/tests -q --cov --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: warn

      - name: Build all distributions
        run: uv build --all-packages

      - name: Core distribution stays pack-free
        run: |
          python3 - <<'EOF'
          import glob, zipfile
          wheel = glob.glob("dist/solakit-[0-9]*.whl")[0]
          z = zipfile.ZipFile(wheel)
          names = z.namelist()
          assert not any(n.startswith("sola_packs") for n in names), \
              "pack code leaked into the core wheel"
          meta = z.read([n for n in names if n.endswith("METADATA")][0]).decode()
          assert "solakit-packs" not in meta, \
              "pack dependency leaked into core metadata"
          print("core wheel clean:", wheel)
          EOF

  audit:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Sync workspace from the lockfile
        run: uv sync --frozen --all-packages
      - name: Audit locked production dependencies
        run: |
          uv export --frozen --all-packages --no-dev --no-emit-workspace --no-hashes --output-file /tmp/solakit-requirements.txt
          uv run pip-audit --no-deps --disable-pip -r /tmp/solakit-requirements.txt

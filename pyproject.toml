[project]
name = "solakit"
version = "0.1.0"
description = "Sola's local personal-agent runtime"
readme = "README.md"
authors = [
    { name = "Sola", email = "sola-ryu@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.163.1",
    "openai>=3.51.0",
    "httpx2>=2.16.2",
    "uvicorn>=0.54.0",
    "pydantic>=2.12",
    "apscheduler>=3.11.3,<4",
]

[project.scripts]
sola = "solakit.cli:main"

[dependency-groups]
dev = ["pytest>=9.2", "ruff>=0.17.5", "mypy>=2.4.1"]

[tool.uv.workspace]
members = ["examples/phase5_pack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.15"
strict = true
files = ["src", "evals", "scripts", "tests"]

[build-system]
requires = ["uv_build==0.12.24"]
build-backend = "uv_build"

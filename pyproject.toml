[project]
name = "solakit"
version = "0.1.0"
description = "A minimal, extensible personal assistant runtime"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11,<14",
    "regex>=2024.11.6",
    "aiohttp>=3.11,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "defusedxml>=0.7,<1",
    "pydantic>=2.10,<3",
    "discord.py>=2.4,<3",
    "apscheduler>=3.11,<4",
    "jinja2>=3.1,<4",
    "markdown-it-py>=3,<5",
    "nh3>=0.3,<1",
]

[project.scripts]
sola = "solakit.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C901"]

[tool.ruff.lint.mccabe]
# Complexity budget: existing offenders carry `# noqa: C901` (an allowlist that
# may only shrink); new functions must stay under the threshold.
max-complexity = 15

[tool.hatch.build.targets.sdist]
exclude = ["/packs"]

[tool.uv.workspace]
members = ["packs/*"]

[tool.uv.sources]
solakit = { workspace = true }
solakit-packs-common = { workspace = true }
solakit-packs-image = { workspace = true }

[tool.mypy]
python_version = "3.12"
files = [
    "src/solakit/api",
    "src/solakit/ui",
    "src/solakit/core/contracts.py",
    "src/solakit/core/loop.py",
    "src/solakit/core/runtime_ops.py",
    "src/solakit/core/step_loop.py",
    "src/solakit/core/store.py",
    "src/solakit/core/store_base.py",
    "src/solakit/core/store_index.py",
    "src/solakit/core/store_sidecars.py",
    "src/solakit/core/store_offsets.py",
    "src/solakit/jobs",
    "src/solakit/services",
]
check_untyped_defs = true
follow_imports = "silent"
ignore_missing_imports = true

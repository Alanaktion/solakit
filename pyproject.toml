[project]
name = "solakit"
version = "0.1.0"
description = "A minimal, extensible personal assistant runtime"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11,<14",
    "aiohttp>=3.11,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "defusedxml>=0.7,<1",
    "pydantic>=2.10,<3",
    "discord.py>=2.4,<3",
    "apscheduler>=3.11,<4",
    "jinja2>=3.1,<4",
    "markdown-it-py>=3,<5",
    "nh3>=0.3,<1",
]

[project.scripts]
sola = "solakit.cli:main"

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.sdist]
exclude = ["/packs"]

[tool.uv.workspace]
members = ["packs/*"]

[tool.uv.sources]
solakit = { workspace = true }
solakit-packs-common = { workspace = true }
solakit-packs-image = { workspace = true }

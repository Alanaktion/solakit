# Copy to config.toml; reference the live persona, never a forked copy.
timezone = "America/Denver"
enabled_tools = []
# Built-ins accept bare names or full paths: ["files", "solakit.tools.repo_git", "runtime"].
# Workspace sync installs external pack distributions; load explicitly: "sola_packs.journal",
# "sola_packs.letters", "sola_packs.email".
# Shell is built in: "shell" or "solakit.tools.shell" (enabled by config).
# Scheduling tools: "jobs"; mutations need jobs.manage, triggering jobs.run;
# other profiles/sessions/delivery additionally need jobs.manage.all.
# Delegation is built in: load "delegate" and grant "delegate.run" to the parent.
# Set delegation.allowed_profiles explicitly; worker profiles should not grant it.
# Memory tools: load "memory" and explicitly grant memory.search/read/remember.
# remember stages exact notes for the existing commit; it never claims extraction.
# Session history search is built in: "sessions" or "solakit.tools.sessions".
# Grant tools = ["sessions.search"] for current-session history; additionally
# capabilities = ["sessions.search.all"] allows another session or all sessions.
# See packs/README.md for their resource sidecar and explicit profile grants.
# enabled_tools = ["solakit.tools.files", "solakit.tools.runtime", "sola_packs.journal"]
# discord_token = { env = "SOLA_DISCORD_TOKEN" }

[operator_token]
env = "SOLA_OPERATOR_TOKEN"
# Alternatively: file = "/absolute/path/to/operator-token" (mode 0600)

[server]
host = "127.0.0.1"
port = 8382 # ASCII decimal S=83, R=82 (sola-ryu)
log_level = "info" # Set debug for backend connection diagnostics.

[model]
base_url = "http://127.0.0.1:8000/v1"
# Optional OpenAI-style Authorization: Bearer token (never inline the token).
# api_key = { env = "OPENAI_API_KEY" }
# Or: api_key = { file = "/absolute/path/to/model-token" } # mode 0600
model_id = "OsaurusAI/Qwen3.6-35B-A3B-mxfp4"
concurrency = 1
# Bound each model completion, including reasoning tokens on supporting backends.
max_tokens = 4096
# Opt in only if this service needs proxy/CA environment settings.
trust_env = false

# Empty by default: loading/granting delegate.run alone enables no worker profile.
[delegation]
allowed_profiles = []
# allowed_profiles = ["research"] # Also configure the worker and its prompt fragment.
timeout_s = 900 # Entire delegation; overrides the parent's generic tool timeout.

[paths]
data = "~/sola-data"
soul = "/absolute/path/to/live/SOUL.md"
fragments = "fragments"

# Optional values inherited by every profile. A value in a named profile replaces
# its default; list values replace the whole list rather than being appended.
[profile_defaults]
context_budget = 32000
mid_run_compaction = false
tools = []
read_scopes = []
write_scopes = []
capabilities = []

[profiles.interactive]
# With enabled_tools including "memory", a deliberate grant could be:
# tools = ["memory.search", "memory.read", "memory.remember"]
max_steps = 60
# Conservative serialized request-byte ceiling. Size this below the model's
# token window, leaving room for [model].max_tokens; this is not a token count.
context_budget = 32000
# Opt in to summarizing between completed tool groups when context exceeds budget.
mid_run_compaction = false
tools = []
# tools = ["*"] grants every loaded tool available to this profile.
# Still requires each tool's capabilities/write scopes; loads no extra modules.
write_scopes = []
capabilities = []

[profiles.maintenance]
# Optional: tools = ["memory.search", "memory.read", "memory.remember"]
max_steps = 60
tools = []
write_scopes = []
capabilities = []

# Example worker (nothing here is enabled by default). Load "files"/"sessions"
# in enabled_tools and create operator-owned fragments/profiles/research.md.
# Add explicitly configured web/wiki read tools as needed. Grant no delegation,
# publish/send/print/shell tools; avoid "*" so the worker cannot delegate again.
# [profiles.research]
# tools = ["files.read", "files.list", "sessions.search"]
# read_scopes = ["path:/absolute/path/to/research-sources"]
# write_scopes = []
# capabilities = []
# max_steps = 40
# context_budget = 64000

# Opt-in OpenViking integration. Set the existing server's URL and canonical
# shared-memory roots; confirm its API version before enabling.
[memory]
enabled = false
trust_env = false
# Automatic recall: recent user/assistant text plus incoming text, tail-capped.
recall_window = 3
recall_query_max_chars = 1000
recall_skip_trivial = true
# This list replaces the default phrases; add your own acknowledgements here.
recall_trivial_phrases = ["thanks", "thank you", "ok", "okay", "yes", "yeah", "lol", "nice", "cool", "got it"]
remember_max_chars = 2000 # Over-limit notes are refused whole, never truncated.
# Legacy incoming-only recall: window=0, max_chars=32000, skip_trivial=false
# using the full key names above. Memory itself remains opt-in.
# base_url = "http://127.0.0.1:1933"
# roots = ["viking://user/sola/memories"]
# user = "sola"
# api_key = { env = "OPENVIKING_API_KEY" }


# Optional values inherited by every [[channels]] entry. Identity and binding
# fields remain explicit in this example so each channel is easy to audit.
[channel_defaults]
profile = "interactive"
trigger = "mention"
trigger_authors = []
enabled = false

[[channels]]
id = "discord-pilot"
type = "discord"
channel_id = "000000000000000000"
session = "pilot"
trigger_authors = ["ALAN_DISCORD_USER_ID"]

# Jobs are managed through /operations, /api/jobs and built-in jobs tools.
# This legacy example is imported once per ID, then managed in app.db.
[[jobs]]
id = "example-poll"
cron = "0 19 * * *"
timezone = "America/Denver"
profile = "interactive"
task = "Review the configured inbox on {date}."
bind_session = "discord-pilot"
sub_session = false # Fresh child with inherited memory; only final delivery reaches channel.
polling = true
catch_up = false
enabled = false

# Optional named resources (nothing is enabled or granted by these examples):

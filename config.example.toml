# Paths are relative to this file. Copy and edit; no services are contacted by check.
schema_version = 1
data_dir = "~/.local/share/sola"
# Explicit import modules for installed trusted packs; loading grants no access.
tool_modules = []
# Built-ins: files.read, files.write, transcripts.search, runtime.status,
# memory.recall, memory.remember; jobs.list/create/update/pause/resume/run_now/delete/pause_all.
loaded_tools = []
shutdown_timeout_seconds = 5
# Operator-owned UTF-8 files, read verbatim; optional and never created by Sola.
# soul_file = "SOUL.md"
# curated_memory_file = "MEMORY.md"

[model]
pin = "Qwen3.6-35B-A3B-mxfp4"
base_url = "http://127.0.0.1:8000/v1"
# OPENAI_API_KEY is used by default; .env is only loaded by the developer probe.
# api_key_env = "SOLA_MODEL_API_KEY"
context_tokens = 32768
connect_timeout_seconds = 5
generation_timeout_seconds = 120

[http]
host = "127.0.0.1"
port = 8765
allowed_origins = ["http://127.0.0.1:8765", "http://localhost:8765"]
# Set this environment variable before serve. The runtime does not load .env.
password_env = "SOLA_OPERATOR_PASSWORD"
secure_cookie = false
session_seconds = 86400
# Remote access: explicit https origins, secure_cookie=true, private backend + TLS proxy.

# OpenViking stable >=0.5.5,<0.6.0; opt-in, with the selected user's managed root.
[memory]
enabled = false
base_url = "http://127.0.0.1:1933"
account = "default"
user = "default"
roots = ["viking://user/default/memories"]
# api_key_env = "OPENVIKING_API_KEY"
timeout_seconds = 15
backlog_cap = 128

[defaults]
workspace_roots = ["."]
# Exact names or * / ? patterns, expanded only against loaded_tools.
tools = []
memory_mode = "optional"
fragments = []

[profiles.short]
# Profiles inherit default; they may only narrow grants and budgets.
tools = []

[profiles.short.budgets]
model_calls = 4
tool_calls = 8
active_seconds = 300

[proactive_budgets]
model_calls = 8
tool_calls = 12
active_seconds = 600

# Applies to automatic scheduled/proactive work. Jobs themselves live in state.db.
[background]
timezone = "America/Denver"
quiet_start = 22
quiet_end = 8
topic_cooldown_seconds = 3600
hourly_runs = 4
daily_runs = 24
max_active = 1
max_pending = 8
notification_ttl_seconds = 86400

# Copy to config.toml; reference the live persona, never a forked copy.
timezone = "America/Denver"
enabled_tools = []
# Built-ins accept bare names or full paths: ["files", "solakit.tools.repo_git", "runtime"].
# Workspace sync installs external pack distributions; load explicitly: "sola_packs.journal",
# "sola_packs.letters", "sola_packs.email".
# Shell is built in: "shell" or "solakit.tools.shell" (enabled by config).
# Scheduling mutations and cross-session runtime access require effect "operate".
# Delegation is built in: load "delegate" and grant "delegate.run" to the parent.
# The current profile is always allowed; list additional worker profiles explicitly.
# Memory tools: load "memory" and explicitly grant memory.search/read/remember.
# remember stages exact notes for the existing commit; it never claims extraction.
# Channel posts are built in: load "messages"; grant messages.send plus effect
# "send" and resources = ["channel:<channel id>"] per destination.
# Session history search is built in: "sessions" or "solakit.tools.sessions".
# Grant tools = ["sessions.search"] for current-session history; additionally
# effects = ["operate"] allows another session or all sessions.
# See packs/README.md for their resource sidecar and explicit profile grants.
# enabled_tools = ["solakit.tools.files", "solakit.tools.runtime", "sola_packs.journal"]
# Astro blog/dream creation and publication: load "sola_packs.blog"; see
# packs/blog/README.md for repo scopes, push grants and optional image covers.
# Read-only APIs and exact calculation: load "web", "feeds", "github", "wiki",
# "datetime", "math"; grant their exact names or "*" in the intended profile.
# See docs/operations/read-tools.md.
# discord_token = { env = "SOLA_DISCORD_TOKEN" }

# Named grant bundles. Profiles and jobs grant "@name"; entries may be exact
# names, first-family patterns or other toolsets. Pure sugar: expanded before
# access checks, shown expanded in run evidence. Narrow profiles built from small
# toolsets keep wrong tools absent, which suits small local models.
[toolsets]
reader = ["files.read", "files.list", "sessions.search", "web.search", "web.get_page"]
editor = ["@reader", "files.write", "files.edit", "files.append"]
mail = ["email.list_mailboxes", "email.search", "email.read", "email.mark_read"]
publishing = ["journal.*", "blog.*"]
ops = ["runtime.status", "jobs.*", "shell.run"]

[tool_apis]
# brave_api_key = { env = "BRAVE_API_KEY" }
# cloudflare_account_id = "your-account-id"
# cloudflare_api_token = { env = "CLOUDFLARE_API_TOKEN" }
# github_token = { env = "GITHUB_TOKEN" }

[operator_token]
env = "SOLA_OPERATOR_TOKEN"
# Alternatively: file = "/absolute/path/to/operator-token" (mode 0600)

[server]
# Base for relative tool paths; ~ expands, relative values use the config directory.
# cwd = "~/workspace" # Must exist; profile filesystem grants still apply.
host = "127.0.0.1"
port = 8382 # ASCII decimal S=83, R=82 (sola-ryu)
log_level = "info" # Set debug for backend connection diagnostics.

[model]
base_url = "http://127.0.0.1:8000/v1"
# Optional OpenAI-style Authorization: Bearer token (never inline the token).
# api_key = { env = "OPENAI_API_KEY" }
# Or: api_key = { file = "/absolute/path/to/model-token" } # mode 0600
model_id = "OsaurusAI/Qwen3.6-35B-A3B-mxfp4"
concurrency = 1
# Bound each model completion, including reasoning tokens on supporting backends.
max_tokens = 4096
# Opt in only if this service needs proxy/CA environment settings.
trust_env = false
# Parse <tool_call> blocks a server leaves in content (see sola doctor).
tool_call_fallback = false

# Sampling and thinking (docs/operations/model-tuning.md). Unset keys are not sent.
[model.request]
# temperature = 0.7
# top_p = 0.8
# top_k = 20
# presence_penalty = 0.5
# parallel_tool_calls = false
# [model.request.extra_body]
# chat_template_kwargs = { enable_thinking = false }

# Empty by default: delegate.run uses the current profile unless another is selected.
[delegation]
allowed_profiles = []
# allowed_profiles = ["research"] # Also configure the worker and its prompt fragment.
timeout_s = 900 # Entire delegation; overrides the parent's generic tool timeout.

[paths]
data = "~/sola-data"
soul = "/absolute/path/to/live/SOUL.md"
fragments = "fragments"

# Compaction when shared OpenViking is unavailable: "auto" summarizes with the
# pinned model for memory-disabled or ephemeral sessions. Default: openviking only.
[compaction]
strategy = "openviking"
# max_summary_tokens = 1024
# max_input_chars = 60000

# Optional values inherited by every profile. A value in a named profile replaces
# its default; list values replace the whole list rather than being appended.
[profile_defaults]
# prompt_layout = "stable" # Per-run time/origin/recall go in a turn block before
# the user text so the system message + history stay a cacheable prefix. "legacy"
# restores the old in-system-message placement.
# Disclosure stays eager by default. See docs/operations/tool-disclosure.md.
# tool_disclosure = "eager" # Opt in per profile to "deferred" after evaluation.
# tool_resident = [] # Ordered, loaded/granted names; deferred initial full schemas.
context_budget = 32000
mid_run_compaction = false
# Forgiving calls and repair accounting (SPEC "Tool result and error contracts").
# argument_mode = "lenient"     # or "strict"
# tool_result_format = "envelope" # "text": plain content, "Error: …" for errors
# repair_ceiling = 6            # per tool+error-class repairs under a run cap
# tool_result_aging = "auto"    # stub old large tool results in requests
# context_tokens = 100000       # calibrated token budget beside context_budget
tools = []
# Empty workspace grants configured repositories only, never runtime data.
# Runtime data access needs an explicit path naming paths.data or a descendant;
# parent paths and anywhere alone do not grant it. Keep evidence grants narrow.
read = "workspace"
write = "none"
effects = []
resources = []

# Workflow guidance (SPEC §5.3–5.4); load "plan"/"playbook" modules to grant tools.
# [profiles.interactive] could also set:
# playbooks = ["triage-inbox"]  # fragments/playbooks/triage-inbox.md
# step_notice_at = 3            # "k steps left" notice near max_steps
# wrapup = "status"             # one answer-only completion after max_steps
# plan_reminder = true          # nudge once when plan items remain open

[profiles.interactive.model]
# thinking = "auto" # "off" | "on" | "auto"
# max_tokens = 8192
# max_reasoning_tokens = 4096

[profiles.interactive]
# With enabled_tools including "memory", a deliberate grant could be:
# tools = ["memory.search", "memory.read", "memory.remember"]
max_steps = 60
# Conservative serialized request-byte ceiling. Size this below the model's
# token window, leaving room for [model].max_tokens; this is not a token count.
context_budget = 32000
# Opt in to summarizing between completed tool groups when context exceeds budget.
mid_run_compaction = false
tools = []
# tools = ["*"] grants every loaded tool available to this profile.
# Family grants such as "files.*" expand in sorted order; load no extra modules.
# Effects and write tiers are checked independently.
write = "none"
effects = []
resources = []

[profiles.maintenance]
# Optional: tools = ["memory.search", "memory.read", "memory.remember"]
max_steps = 60
tools = []
write = "none"
effects = []
resources = []

# Example worker (nothing here is enabled by default). Load "files"/"sessions"
# in enabled_tools and create operator-owned fragments/profiles/research.md.
# Add explicitly configured web/wiki read tools as needed. Grant no delegation,
# publish/send/print/shell tools; avoid "*" so the worker cannot delegate again.
# [profiles.research]
# tools = ["files.*", "web.*", "sessions.search"]
# workspace = ["path:/absolute/path/to/research-sources", "path:/absolute/path/to/research-out"]
# write_workspace = ["path:/absolute/path/to/research-out"]
# read = "workspace"
# write = "workspace"
# effects = []
# resources = []
# max_steps = 40
# context_budget = 64000
# Session isolation for tool calls, one switch per direction (a profile always
# reads its own sessions; ownership is the writing run's profile):
# sessions_private = false      # true: other profiles' tools cannot read my sessions
# sessions_read_others = true   # false: my tools cannot read other profiles' sessions

# Opt-in OpenViking integration. Set the existing server's URL and canonical
# shared-memory roots; confirm its API version before enabling.
[memory]
# Optional fragments/memory.md is always included, even with memory disabled.
# Offline curation cap; runtime preserves the full file.
front_page_max_chars = 8192
enabled = false
compaction_timeout_s = 300 # Extraction wait budget, separate from HTTP timeout_s.
trust_env = false
# Automatic recall: recent user/assistant text plus incoming text, tail-capped.
recall_window = 3
recall_query_max_chars = 1000
recall_skip_trivial = true
# This list replaces the default phrases; add your own acknowledgements here.
recall_trivial_phrases = ["thanks", "thank you", "ok", "okay", "yes", "yeah", "lol", "nice", "cool", "got it"]
remember_max_chars = 2000 # Over-limit notes are refused whole, never truncated.
# Legacy incoming-only recall: window=0, max_chars=32000, skip_trivial=false
# using the full key names above. Memory itself remains opt-in.
# base_url = "http://127.0.0.1:1933"
# roots = ["viking://user/sola/memories"]
# user = "sola"
# api_key = { env = "OPENVIKING_API_KEY" }
#
# Per-profile isolation: a profile may use its own OpenViking user and roots.
# All recall, memory tools, commits and compaction summaries from that profile's
# runs use them instead of the global values above. Requires [memory] enabled.
# [profiles.private.memory]
# user = "sola-private"
# roots = ["viking://user/sola-private/memories"]


# Optional values inherited by every [[channels]] entry. Identity and binding
# fields remain explicit in this example so each channel is easy to audit.
[channel_defaults]
profile = "interactive"
trigger = "mention"
trigger_authors = []
enabled = false

[[channels]]
id = "discord-pilot"
type = "discord"
channel_id = "000000000000000000"
session = "pilot"
trigger_authors = ["ALAN_DISCORD_USER_ID"]

# Jobs are managed through /operations, /api/jobs and built-in jobs tools.
# This legacy example is imported once per ID, then managed in app.db.
[[jobs]]
id = "example-poll"
cron = "0 19 * * *"
timezone = "America/Denver"
profile = "interactive"
task = "Review the configured inbox on {date}."
# Omit tools to inherit profile grants; an explicit list only narrows them.
# tools = [] # No model-callable tools (for example, a pure announcement).
# tools = ["runtime.status"] # Must already be granted by this profile.
# tool_disclosure = "inherit" # Or "eager" / "deferred".
# Omit tool_resident to inherit profile residents, intersected with job tools.
# tool_resident = [] # Override: discovery only initially in deferred mode.
bind_session = "discord-pilot"
sub_session = false # Fresh child with inherited memory; only final delivery reaches channel.
polling = true
catch_up = false
enabled = false

# Optional named resources (nothing is enabled or granted by these examples):
# [repositories]
# site = "/absolute/path/to/site"
#
# [collections.dreams]
# repository = "site"
# directory = "_dreams"
# filename = "{date}-{slug}.md"

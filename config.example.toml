# Built-in effective defaults; see docs/config.md for every setting.
# Copy and set model.pin and defaults.workspace_roots before use.
# Paths are relative to this file. No services are contacted by check.
schema_version = 1
agent_name = "Sola"
# Optional user.css in data_dir overrides the default UI stylesheet on page reload.
data_dir = "~/.local/share/sola"
# Explicit import modules for installed trusted packs; loading grants no access.
tool_modules = []
# Built-ins: files.list, files.read, files.search, files.glob, files.grep,
# files.write, files.append, files.edit,
# files.rename, files.copy, files.mkdir, files.delete, images.generate,
# transcripts.search, web.search, web.fetch, mcp.list, mcp.call, git.status/diff/pull/publish,
# shell.exec, delegate.run, delegate.continue, runtime.status,
# memory.recall, memory.remember; jobs.follow_up/list/create/update/pause/resume/run_now/delete/pause_all.
# blog.list/read/create/publish; dreams.list/read/create (always publishes).
# Separate deadlines for the HTTP connection drain and runtime cleanup.
shutdown_timeout_seconds = 5
# Operator-owned UTF-8 files, read verbatim; optional and never created by Sola.
# soul_file = "SOUL.md"
# curated_memory_file = "MEMORY.md"
# Optional worker profile. Grant "delegate.run" to delegate and "delegate.continue" to follow up.
# delegation_worker = "research"

[model]
# Required: exact oMLX model ID, e.g. "Qwen3.6-35B-A3B-mxfp4".
pin = ""
# Enable only after verifying image input support for this exact model pin.
image_inputs = false
base_url = "http://127.0.0.1:8000/v1"
# OPENAI_API_KEY is used by default; .env is only loaded by the developer probe.
# api_key_env = "SOLA_MODEL_API_KEY"
context_tokens = 32768
connect_timeout_seconds = 5
generation_timeout_seconds = 120

# Optional recognition model. Keep model.image_inputs = false when using this section.
# [vision]
# pin = "Qwen3-VL-8B-Instruct-4bit"
# base_url = "http://127.0.0.1:8000/v1"
# api_key_env = "SOLA_VISION_API_KEY"
# connect_timeout_seconds = 5
# generation_timeout_seconds = 120

# Optional one-image ComfyUI workflow; enabling still requires a tool grant.
[images]
enabled = false
base_url = "http://127.0.0.1:8188"
timeout_seconds = 15
poll_seconds = 2
max_checks = 300
# Image jobs also require explicit job workspace_roots. Give generation enough time:
# [defaults.budgets] tool_timeout_seconds = 600 (within active_seconds).

# Optional blog checkout; also grant it in defaults.workspace_roots and tools.
# Publication pushes ALL pending commits to origin/main, including unrelated commits.
[blog]
# repository = "~/workspace/blog"

# Optional named Git checkout. Include the checkout in workspace_roots and grant exact tool names.
# [git.repositories.project]
# path = "~/workspace/project"
# branch = "main"

# Optional correspondence checkout. Repository alone reserves it against generic writes.
# Use a separate checkout for blog and dreams. Seed existing v1 replies before granting publication.
# [letters]
# repository = "~/workspace/letters"
# branch = "main"
# directory = "." # Repository-relative. Use "letters" for a checkout with a letters/ subdirectory.
# author = "sola"
# peer = "dingus"

# Optional Brave public web search. Set the named environment variable and grant web.search.
# Existing wildcard grants can match web.search on new admissions once enabled.
[web_search]
# api_key_env = "BRAVE_SEARCH_API_KEY"

# Optional Cloudflare Browser Run Markdown extraction. Set both fields and grant web.fetch.
# [web_fetch]
# account_id = "0123456789abcdef0123456789abcdef"
# api_token_env = "CLOUDFLARE_API_TOKEN" # Token with Browser Run - Edit permission.

# Optional remote MCP servers (Streamable HTTP only). Grant mcp.list and mcp.call.
# headers_env maps a header name to an environment variable holding its whole value.
# [mcp_servers.wiki]
# url = "https://wiki.example/mcp"
# headers = { "X-Workspace" = "personal" }
# headers_env = { Authorization = "WIKI_MCP_AUTHORIZATION" } # e.g. "Bearer <token>"

# To enable interactive commands, set enabled and include "shell.exec" literally in tools.
# Commands have the server account's filesystem and network privileges.
# Workspace roots constrain the starting directory. Use OS isolation for narrower privileges.
[shell]
enabled = false

# Subscriptions and cached items live in state.db. Grant the individual feeds.* tool names.
[feeds]
enabled = false
max_feeds = 32
max_agent_feeds = 10
max_agent_additions_per_day = 2
poll_interval_minutes = 60
item_retention_days = 30
max_items_per_feed = 500
max_consecutive_failures = 5

[http]
host = "127.0.0.1"
port = 8765
allowed_origins = ["http://127.0.0.1:8765", "http://localhost:8765"]
# Set this environment variable before serve. The runtime does not load .env.
password_env = "SOLA_OPERATOR_PASSWORD"
secure_cookie = false
session_seconds = 86400
# LAN HTTP: bind 0.0.0.0 and add the server's exact private IP and port, e.g.
# allowed_origins = ["http://192.168.1.20:8765"] with secure_cookie=false.
# Tailnet HTTP: use the server's own Tailscale IP in host and allowed_origins, e.g.
# host = "100.64.1.20"
# allowed_origins = ["http://100.64.1.20:8765"]
# Public IPs/hostnames: explicit https origins, secure_cookie=true, private backend + TLS proxy.

# OpenViking stable >=0.5.5,<0.6.0; opt-in, with the selected user's managed root.
[memory]
enabled = false
base_url = "http://127.0.0.1:1933"
account = "default"
user = "default"
# Required when enabled: ["viking://user/default/memories"] for user "default".
roots = []
# api_key_env = "OPENVIKING_API_KEY"
timeout_seconds = 15
backlog_cap = 128

[defaults]
# Required: at least one existing directory, e.g. ["."] beside this file.
workspace_roots = []
# Exact names or * / ? patterns, expanded against built-ins and tool_modules tools.
tools = []
memory_mode = "optional"
fragments = []

[defaults.budgets]
model_calls = 16
tool_calls = 32
active_seconds = 900
output_tokens = 4096
tool_result_bytes = 65536
tool_timeout_seconds = 60

# Optional child profile; inherits default and may only narrow grants/budgets.
# [profiles.short]
# tools = []
# [profiles.short.budgets]
# model_calls = 4
# tool_calls = 8
# active_seconds = 300

# Delegation worker. Add "files.read" and "delegate.run" to [defaults].tools first.
# [profiles.research]
# tools = ["files.read"]
# fragments = ["research.md"]  # Operator-owned instructions for the worker.
# [profiles.research.budgets]
# model_calls = 5

# Optional dedicated profiles. First admit their workspace and named grants in [defaults].
# [profiles.correspondence]
# workspace_roots = ["~/workspace/letters"]
# tools = ["letters.inbox", "letters.read", "letters.send", "letters.reply"]
# [profiles.correspondence_job]
# workspace_roots = ["~/workspace/letters"]
# tools = ["letters.inbox", "letters.read"]
# Set explicit job workspace_roots covering the checkout to permit an inbox update.

[proactive_budgets]
# Omitted overrides use these automatic ceilings, capped by profile budgets.
# model_calls = 8
# tool_calls = 12
# active_seconds = 600

# Applies to automatic scheduled/proactive work. Jobs themselves live in state.db.
[background]
timezone = "America/Denver"
quiet_start = 22
quiet_end = 8
topic_cooldown_seconds = 3600
hourly_runs = 4
daily_runs = 24
max_active = 1
max_pending = 8
notification_ttl_seconds = 86400

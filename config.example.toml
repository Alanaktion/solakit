# Paths are relative to this file. Copy and edit; no services are contacted by check.
schema_version = 1
data_dir = "~/.local/share/sola"
# Explicit import modules for installed trusted packs; loading grants no access.
tool_modules = []
# Built-ins: files.read, files.write, transcripts.search, runtime.status, memory.recall.
loaded_tools = []
shutdown_timeout_seconds = 5
# Operator-owned UTF-8 files, read verbatim; optional and never created by Sola.
# soul_file = "SOUL.md"
# curated_memory_file = "MEMORY.md"

[model]
pin = "Qwen3.6-35B-A3B-mxfp4"
base_url = "http://127.0.0.1:8000/v1"
# OPENAI_API_KEY is used by default; .env is only loaded by the developer probe.
# api_key_env = "SOLA_MODEL_API_KEY"
context_tokens = 32768
connect_timeout_seconds = 5
generation_timeout_seconds = 120

[defaults]
workspace_roots = ["."]
# Exact names or * / ? patterns, expanded only against loaded_tools.
tools = []
memory_mode = "optional"
fragments = []

[profiles.short]
# Profiles inherit default; they may only narrow grants and budgets.
tools = []

[profiles.short.budgets]
model_calls = 4
tool_calls = 8
active_seconds = 300

[proactive_budgets]
model_calls = 8
tool_calls = 12
active_seconds = 600

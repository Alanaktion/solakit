[project]
name = "solakit-packs-blog"
version = "0.1.0"
description = "Astro blog and dream publishing tools for Solakit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["solakit>=0.1.0,<0.2", "solakit-packs-common>=0.1.0,<0.2", "pyyaml>=6,<7"]

[project.optional-dependencies]
image = ["solakit-packs-image>=0.1.0,<0.2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sola_packs"]

[project]
name = "solakit-packs-shell"
version = "0.1.0"
description = "Explicit maintenance shell tools for Solakit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["solakit>=0.1.0,<0.2", "solakit-packs-common>=0.1.0,<0.2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sola_packs"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

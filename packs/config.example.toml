# This sidecar belongs to optional packs, not core config.toml.
# Set SOLA_PACKS_CONFIG to its absolute path. Secrets are references only.

[letters.correspondence]
repository = "letters" # Must exist in core [repositories].
directory = "."
author = "sola"
peer = "dingus"
# Optional: layout = "In reply to {reply_to}\n\n{body}\n"
# max_entries = 10000

[mailboxes.personal]
imap_host = "imap.example.invalid"
imap_port = 993
username = "sola@example.invalid"
address = "sola@example.invalid"
password = { env = "SOLA_MAIL_PASSWORD" }
folder = "INBOX"
smtp_host = "smtp.example.invalid" # Omit to configure read-only access.
smtp_port = 465
smtp_security = "tls" # Or "starttls", usually with port 587.
# smtp_username = "sola@example.invalid"
# smtp_password = { file = "mail-password" } # Relative to this file; mode 0600.
timeout_s = 15
max_message_bytes = 1000000

# Optional 58mm ESC/POS thermal printer; replace IDs with actual hardware.
# No cut command: feed two lines after text.
# [printers.desk]
# transport = "usb"
# vendor_id = 0x1234
# product_id = 0x5678
# profile = "simple"
# columns = 32
# feed_lines = 2
# timeout_s = 10
# max_text_bytes = 16000
# For USB-to-serial, omit USB IDs and set transport = "serial",
# serial_device = "/dev/cu.usbserial-EXAMPLE", baudrate = 9600.

# Optional read-only calendar export; also needs a profile filesystem read scope.
# [calendars.personal]
# file = "/absolute/path/to/calendar.ics"
# timezone = "America/Denver"
# max_bytes = 1000000

# Optional ComfyUI API-format workflow. Grant image.generate/image.result,
# resource image:studio, a non-none write tier, and workflow filesystem read scope.
# [images.studio]
# base_url = "http://127.0.0.1:8188"
# workflow = "/absolute/path/to/workflow.json"
# prompt_node = "45"
# prompt_input = "text"
# seed_node = "44"
# seed_input = "seed"
# size_node = "41" # Shorthand for both nodes; explicit mappings below override.
# width_node = "41"
# width_input = "width"
# height_node = "41"
# height_input = "height"
# image.generate defaults to width=768 and height=768 (64–4096, multiples of 8).
# token = { env = "COMFY_TOKEN" }

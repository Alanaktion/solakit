# This sidecar belongs to optional packs, not core config.toml.
# Set SOLA_PACKS_CONFIG to its absolute path. Secrets are references only.

[letters.correspondence]
repository = "letters" # Must exist in core [repositories].
directory = "."
author = "sola"
peer = "dingus"
# Optional: layout = "In reply to {reply_to}\n\n{body}\n"
# max_entries = 10000

[mailboxes.personal]
imap_host = "imap.example.invalid"
imap_port = 993
username = "sola@example.invalid"
address = "sola@example.invalid"
password = { env = "SOLA_MAIL_PASSWORD" }
folder = "INBOX"
smtp_host = "smtp.example.invalid" # Omit to configure read-only access.
smtp_port = 465
smtp_security = "tls" # Or "starttls", usually with port 587.
# smtp_username = "sola@example.invalid"
# smtp_password = { file = "mail-password" } # Relative to this file; mode 0600.
timeout_s = 15
max_message_bytes = 1000000

# Optional 58mm ESC/POS thermal printer; replace IDs with actual hardware.
# No cut command: feed two lines after text.
# [printers.desk]
# transport = "usb"
# vendor_id = 0x1234
# product_id = 0x5678
# profile = "simple"
# columns = 32
# feed_lines = 2
# timeout_s = 10
# max_text_bytes = 16000
# For USB-to-serial, omit USB IDs and set transport = "serial",
# serial_device = "/dev/cu.usbserial-EXAMPLE", baudrate = 9600.

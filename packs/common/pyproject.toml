[project]
name = "solakit-packs-common"
version = "0.1.0"
description = "Shared configuration, evidence and process helpers for Solakit packs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["solakit>=0.1.0,<0.2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sola_packs"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

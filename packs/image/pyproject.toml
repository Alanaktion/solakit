[project]
name = "solakit-packs-image"
version = "0.1.0"
description = "Receipted named ComfyUI image workflows for Solakit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["solakit>=0.1.0,<0.2", "solakit-packs-common>=0.1.0,<0.2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sola_packs"]

[tool.hatch.build.targets.wheel.force-include]
"workflow.json" = "sola_packs/image_workflow.json"
